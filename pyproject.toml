[project]
name = "litagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Euan Turner", email = "euanoturner@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "httpx>=0.28.1",
    "openai>=3.7.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.0.0",
    "pyyaml>=6.0.2",
    "slack-sdk>=3.36.0",
]

[project.scripts]
litagent = "litagent:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]
